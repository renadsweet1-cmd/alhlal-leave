<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شؤون الهلال الأحمر | لوحة التحكم المتكاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep-black: #08080a;
            --bg-sidebar: #0f0f12;
            --bg-card: #141417;
            --bg-input: #1c1c24;
            --primary-red: #ff384a;
            --primary-hover: #e02f40;
            --dark-red: #3d1418;
            --text-white: #ffffff;
            --text-muted: #808191;
            --border-color: #24242e;
            --neon-glow: 0 0 15px rgba(255, 56, 74, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-deep-black);
            color: var(--text-white);
            min-height: 100vh;
            display: block; /* إلغاء الـ flex المسبب للمشكلة */
        }

        /* حاوية التصميم الرئيسية المقسمة لثلاثة أعمدة */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 250px 1fr 280px;
            min-height: 100vh;
            width: 100%;
        }

        /* --- 1. القائمة الجانبية اليمنى --- */
        .sidebar-right {
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border-color);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 35px;
        }

        .sidebar-brand .logo {
            font-size: 22px;
            color: var(--primary-red);
            filter: drop-shadow(0 0 5px var(--primary-red));
        }

        .menu-list {
            list-style: none;
        }

        .menu-item {
            margin-bottom: 6px;
        }

        .menu-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .menu-item.active a {
            background-color: rgba(255, 56, 74, 0.08);
            color: var(--primary-red);
            font-weight: 500;
        }
