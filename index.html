<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شؤون الهلال الأحمر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* درجات الأسود والأحمر الدقيقة من الصورة */
            --bg-deep-black: #08080a;
            --bg-sidebar: #0f0f12;
            --bg-card: #141417;
            --primary-red: #ff384a;
            --dark-red: #3d1418;
            --text-white: #ffffff;
            --text-muted: #808191;
            --border-color: #24242e;
            /* تأثير توهج الأحمر */
            --neon-glow: 0 0 12px rgba(255, 56, 74, 0.4);
            /* خطوط Tajawal */
            font-family: 'Tajawal', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep-black);
            color: var(--text-white);
            display: flex;
            min-height: 100vh;
            overflow: hidden; /* لمنع السكرول المزدوج */
        }

        /* --- القائمة الجانبية (Sidebar) --- */
        .sidebar {
            width: 250px;
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border-color);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: var(--text-white);
            font-size: 17px;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        .sidebar-brand span.logo {
            font-size: 22px;
            color: var(--primary-red);
            filter: drop-shadow(0 0 5px var(--primary-red));
        }

        .menu-list {
            list-style: none;
        }

        .menu-item {
            margin-bottom: 5px;
        }

        .menu-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .menu-item.active a {
            background-color: rgba(255, 56, 74, 0.08);
            color: var(--primary-red);
            font-weight: 500;
        }

        .menu-item a:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-white);
        }

        .menu-icon {
            font-size: 18px;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
