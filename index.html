<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شؤون الهلال الأحمر | لوحة التحكم المتكاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep-black: #08080a;
            --bg-sidebar: #0f0f12;
            --bg-card: #141417;
            --bg-input: #1c1c24;
            --primary-red: #ff384a;
            --primary-hover: #e02f40;
            --dark-red: #3d1418;
            --text-white: #ffffff;
            --text-muted: #808191;
            --border-color: #24242e;
            --neon-glow: 0 0 15px rgba(255, 56, 74, 0.25);
        }

        /* تصحيح شامل لضمان ظهور الصفحة وعدم اختفائها */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-deep-black);
            color: var(--text-white);
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        /* حاوية التقسيم الثلاثي الآمنة والمجربة */
        .wrapper {
            display: table;
            width: 100%;
            table-layout: fixed;
            min-height: 100vh;
        }

        /* تحويل الأعمدة إلى خلايا جدول لضمان العرض التلقائي وعدم حدوث شاشة سوداء */
        .sidebar-right-col {
            display: table-cell;
            width: 240px;
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border-color);
            vertical-align: top;
            padding: 20px 15px;
        }

        .main-content-col {
            display: table-cell;
            vertical-align: top;
            padding: 25px;
        }

        .sidebar-left-col {
            display: table-cell;
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            vertical-align: top;
            padding: 20px 15px;
        }

        /* --- تنسيقات القائمة اليمنى --- */
        .sidebar-brand {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-white);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-brand .logo {
            color: var(--primary-red);
            filter: drop-shadow(0 0 5px var(--primary-red));
        }
        .menu-list { list-style: none; }
        .menu-item { margin-bottom: 8px; }
        .menu-item a {
            display: block;
            padding: 12px 15px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }
        .menu-item.active a {
            background-color: rgba(255, 56, 74, 0.1);
            color: var(--primary-red);
            font-weight: 700;
        }
