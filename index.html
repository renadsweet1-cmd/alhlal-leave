<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إجازة خارجية | الهلال الأحمر</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #e63946;
            --primary-hover: #c12735;
            --border-color: #cccccc;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --border-color: #444444;
            --input-bg: #3d3d3d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-placeholder {
            width: 50px;
            height: 50px;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 12px;
        }

        .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
            color: var(--text-color);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-decoration: none;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
        }

        .date-row {
            display: flex;
            gap: 15px;
        }

        .date-row .form-group {
            flex: 1;
        }

        .info-text {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .checkbox-group input {
            width: auto;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button.main-btn {
            flex: 1;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        button.main-btn:hover {
            background-color: var(--primary-hover);
        }

        button.secondary-btn {
            padding: 12px 20px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
        }

        .output-area {
            margin-top: 30px;
            padding: 15px;
            background-color: var(--bg-color);
            border-radius: 5px;
            border: 1px dashed var(--border-color);
            display: none;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            font-family: inherit;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <div class="logo-placeholder">الهلال</div>
            <div><strong>شؤون الهلال الأحمر</strong></div>
        </div>
        <button class="theme-btn" onclick="toggleTheme()">🌙/☀️ تغيير الوضع</button>
    </div>

    <div class="container">
        <a href="#" class="back-link">🔙 رجوع للقائمة</a>
        
        <h1>✈️ نموذج إجازة خارجية</h1>

        <div class="form-group">
            <label>📋 نوع الطلب</label>
            <select id="leaveType">
                <option value="العودة من إجازة خارجية">العودة من إجازة خارجية</option>
                <option value="طلب إجازة خارجية">طلب إجازة خارجية</option>
            </select>
        </div>

        <div class="form-group">
            <label>🆔 ID المسعف</label>
            <input type="text" id="medicId" placeholder="أدخل الرقم التعريفي للمسعف">
        </div>

        <div class="form-group">
            <label>✍️ إعتماد (ID الخاص بك)</label>
            <input type="text" id="approverId" placeholder="أدخل الرقم التعريفي الخاص بك">
        </div>

        <div class="form-group">
            <label>📅 عدد الأيام</label>
            <input type="number" id="daysCount" min="1" placeholder="مثال: 5">
        </div>

        <div class="date-row">
            <div class="form-group">
                <label>🟢 من تاريخ</label>
                <input type="date" id="startDate">
                <div class="info-text">توقيت السعودية</div>
            </div>
            <div class="form-group">
                <label>🔴 إلى تاريخ</label>
                <input type="date" id="endDate">
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="requestRole">
            <label for="requestRole">🔔 لا تنسى طلب رول</label>
        </div>

        <div class="btn-group">
            <button class="main-btn" onclick="generateOutput()">🖨️ إصدار الصادر</button>
            <button class="secondary-btn" onclick="copyOutputDirectly()">📋 نسخ الصادر</button>
        </div>

        <div class="output-area" id="outputArea">
            <div class="output-header">
                <strong>📤 الصادر الناتج:</strong>
                <button class="theme-btn" onclick="copyResultText()">📋 نسخ</button>
            </div>
            <pre id="outputText"></pre>
        </div>
    </div>

    <footer>
        © 2026 بوابة شؤون الهلال الأحمر — جميع الحقوق محفوظة لقطاع الهلال الأحمر التابع لـ Lana District
    </footer>

    <script>
        // تعيين تاريخ اليوم كقيمة افتراضية لتاريخ البدء وتاريخ النهاية
        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = today;
        }

        // دالة تبديل الوضع الداكن والفاتح
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }

        // دالة إنشاء النص النهائي للصادر
        function buildText() {
            const leaveType = document.getElementById('leaveType').value;
            const medicId = document.getElementById('medicId').value || '---';
            const approverId = document.getElementById('approverId').value || '---';
            const daysCount = document.getElementById('daysCount').value || '---';
            const startDate = document.getElementById('startDate').value || '---';
            const endDate = document.getElementById('endDate').value || '---';
            const requestRole = document.getElementById('requestRole').checked ? "نعم" : "لا";

            return `** نموذج: ${leaveType} **\n` +
                   `🆔 ID المسعف: ${medicId}\n` +
                   `✍️ إعتماد بواسطة: ${approverId}\n` +
                   `📅 عدد الأيام: ${daysCount}\n` +
                   `🟢 من تاريخ: ${startDate}\n` +
                   `🔴 إلى تاريخ: ${endDate}\n` +
                   `🔔 طلب رول: ${requestRole}`;
        }

        // عرض الصادر في الساحة المخصصة له
        function generateOutput() {
            const outputArea = document.getElementById('outputArea');
            const outputText = document.getElementById('outputText');
            
            outputText.innerText = buildText();
            outputArea.style.display = 'block';
        }

        // نسخ النص من ساحة العرض بعد إصدارها
        function copyResultText() {
            const text = document.getElementById('outputText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('تم نسخ الصادر بنجاح!');
            }).catch(err => {
                alert('حدث خطأ أثناء النسخ، يرجى تحديث الصفحة والمحاولة مجدداً.');
            });
        }

        // نسخ الصادر مباشرة دون الحاجة لعرضه أولاً
        function copyOutputDirectly() {
            const text = buildText();
            navigator.clipboard.writeText(text).then(() => {
                alert('تم نسخ الصادر مباشرة إلى الحافظة!');
            }).catch(err => {
                alert('حدث خطأ أثناء النسخ، يرجى تحديث الصفحة والمحاولة مجدداً.');
            });
        }
    </script>
</body>
</html>
